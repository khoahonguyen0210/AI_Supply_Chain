spring:
  application:
    name: scm-backend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:scm}
    username: ${POSTGRES_USER:scm}
    password: ${POSTGRES_PASSWORD:change-me}
  flyway:
    locations: classpath:db/migration

server:
  port: ${BACKEND_PORT:8080}

management:
  # Operational endpoints live on their own port so they are never exposed with the public API.
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

scm:
  service-name: scm-backend
  version: "@project.version@"
  ml-service-url: ${ML_SERVICE_URL:http://localhost:8001}
  ml-read-timeout: 120s
  jobs:
    worker-enabled: ${SCM_JOBS_WORKER_ENABLED:true}
    poll-interval: 1s
    lease: 5m
    max-attempts: 3
    retry-backoff: 2s
