spring:
  application:
    name: scm-backend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:scm}
    username: ${POSTGRES_USER:scm}
    password: ${POSTGRES_PASSWORD:change-me}
  flyway:
    locations: classpath:db/migration

server:
  port: ${BACKEND_PORT:8080}

management:
  # Operational endpoints live on their own port so they are never exposed with the public API.
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

scm:
  security:
    # No default on purpose: the service will not start without SCM_JWT_SECRET (32+ bytes).
    jwt-secret: ${SCM_JWT_SECRET:}
    token-ttl: 8h
  service-name: scm-backend
  version: "@project.version@"
  ml-service-url: ${ML_SERVICE_URL:http://localhost:8001}
  ml-read-timeout: 120s
  # Shared secret the planning engine requires (same value as its SCM_ML_INTERNAL_TOKEN).
  ml-internal-token: ${SCM_ML_INTERNAL_TOKEN:}
  jobs:
    worker-enabled: ${SCM_JOBS_WORKER_ENABLED:true}
    poll-interval: 1s
    lease: 5m
    max-attempts: 3
    retry-backoff: 2s
