# Tests drive the job worker explicitly (JobWorker.runOnce/drain) so they never wait on a poll, and
# retries are immediate so a failing job can be run to exhaustion in one test.
scm.jobs.worker-enabled=false
scm.jobs.retry-backoff=0s

# Test-only signing key and accounts; real deployments get theirs from the environment.
scm.security.jwt-secret=test-only-signing-key-0123456789-abcdefghij
scm.security.bootstrap-users[0].user-id=pat
scm.security.bootstrap-users[0].display-name=Pat
scm.security.bootstrap-users[0].role=planner
scm.security.bootstrap-users[0].password=pat-test-password-1
scm.security.bootstrap-users[1].user-id=root
scm.security.bootstrap-users[1].display-name=Root
scm.security.bootstrap-users[1].role=admin
scm.security.bootstrap-users[1].password=root-test-password-1

# The shared test context signs in many times from one address; generous limits keep unrelated tests apart.
# AbuseProtectionTest sets low limits in a context of its own.
scm.security.rate-limit.login-per-ip=1000
scm.security.rate-limit.login-per-user=1000
scm.security.rate-limit.api-per-user=100000
scm.security.rate-limit.expensive-per-user=100000
