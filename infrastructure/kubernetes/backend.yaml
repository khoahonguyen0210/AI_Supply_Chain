# Spring backend serving the API. Its job worker is off: jobs run in the `worker` deployment.
# It talks to the single stateful engine (agent tasks, approvals).
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: scm
  POSTGRES_USER: scm
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      # Service env links (BACKEND_PORT=tcp://...) would clash with the app settings
      enableServiceLinks: false
      containers:
        - name: backend
          image: scm-backend
          envFrom:
            - configMapRef: { name: backend-config }
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: scm-secrets, key: POSTGRES_PASSWORD } }
            - name: SCM_JWT_SECRET
              valueFrom: { secretKeyRef: { name: scm-secrets, key: SCM_JWT_SECRET } }
            - name: SCM_ML_INTERNAL_TOKEN
              valueFrom: { secretKeyRef: { name: scm-secrets, key: SCM_ML_INTERNAL_TOKEN } }
            - name: SCM_DEMO_PASSWORD
              valueFrom: { secretKeyRef: { name: scm-secrets, key: SCM_DEMO_PASSWORD } }
            - { name: ML_SERVICE_URL, value: "http://engine:8001" }
            - { name: SCM_JOBS_WORKER_ENABLED, value: "false" }
            - { name: SCM_SECURITY_TRUSTFORWARDEDFOR, value: "true" }
            # local cluster only: lets one benchmark user enqueue a batch (default 30/min)
            - { name: SCM_SECURITY_RATELIMIT_EXPENSIVEPERUSER, value: "1000" }
            - { name: SCM_SECURITY_BOOTSTRAPUSERS_0_USERID, value: planner }
            - { name: SCM_SECURITY_BOOTSTRAPUSERS_0_DISPLAYNAME, value: Pat Planner }
            - { name: SCM_SECURITY_BOOTSTRAPUSERS_0_ROLE, value: planner }
            - { name: SCM_SECURITY_BOOTSTRAPUSERS_0_PASSWORD, value: $(SCM_DEMO_PASSWORD) }
            - { name: SCM_SECURITY_BOOTSTRAPUSERS_1_USERID, value: manager }
            - { name: SCM_SECURITY_BOOTSTRAPUSERS_1_DISPLAYNAME, value: Mia Manager }
            - { name: SCM_SECURITY_BOOTSTRAPUSERS_1_ROLE, value: procurement_manager }
            - { name: SCM_SECURITY_BOOTSTRAPUSERS_1_PASSWORD, value: $(SCM_DEMO_PASSWORD) }
            - { name: SCM_SECURITY_BOOTSTRAPUSERS_2_USERID, value: finance }
            - { name: SCM_SECURITY_BOOTSTRAPUSERS_2_DISPLAYNAME, value: Fin Finance }
            - { name: SCM_SECURITY_BOOTSTRAPUSERS_2_ROLE, value: finance }
            - { name: SCM_SECURITY_BOOTSTRAPUSERS_2_PASSWORD, value: $(SCM_DEMO_PASSWORD) }
            - { name: SCM_SECURITY_BOOTSTRAPUSERS_3_USERID, value: admin }
            - { name: SCM_SECURITY_BOOTSTRAPUSERS_3_DISPLAYNAME, value: Ada Admin }
            - { name: SCM_SECURITY_BOOTSTRAPUSERS_3_ROLE, value: admin }
            - { name: SCM_SECURITY_BOOTSTRAPUSERS_3_PASSWORD, value: $(SCM_DEMO_PASSWORD) }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 8081 }
          startupProbe:
            httpGet: { path: /actuator/health, port: management }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: NodePort
  selector: { app: backend }
  ports:
    - { name: http, port: 8080, targetPort: http, nodePort: 30380 }
    - { name: management, port: 8081, targetPort: management }
