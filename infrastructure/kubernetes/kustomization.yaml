# secrets.env is git-ignored; scripts/kind.sh generates it with random values.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: scm
resources:
  - namespace.yaml
  - postgres.yaml
  - backend.yaml
  - worker.yaml
  - engine.yaml
  - seed-job.yaml
  - frontend.yaml
secretGenerator:
  - name: scm-secrets
    envs:
      - secrets.env
generatorOptions:
  disableNameSuffixHash: true
labels:
  - pairs:
      app.kubernetes.io/part-of: scm
images:
  - name: scm-backend
    newTag: local
  - name: scm-ml
    newTag: local
  - name: scm-frontend
    newTag: local
