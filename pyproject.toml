[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-scm-platform"
version = "0.1.0"
description = "AI Supply Chain Decision Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.7",
    "numpy>=2.0",
    "pandas>=2.2",
    "openpyxl>=3.1.5",
    "lightgbm>=4.7.0",
    "scipy>=1.14",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1",
    "fastembed>=0.8.1",
    "anthropic>=1.11.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "testcontainers[postgresql]>=4.9",
]

[tool.setuptools.packages.find]
where = ["src", "ml/src"]

[tool.pytest.ini_options]
pythonpath = ["src", "ml/src"]
testpaths = ["ml/tests", "tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires external services (PostgreSQL, Redis)",
    "e2e: full-stack end-to-end test",
    "smoke: checks against a running deployment (SCM_SMOKE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "ml/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src", "ml/src"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["lightgbm.*", "scipy.*", "docker.*", "testcontainers.*", "pgvector.*"]
ignore_missing_imports = true
