[project]
name = "ai-scm-platform"
version = "0.1.0"
description = "AI Supply Chain Decision Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.7",
    "numpy>=2.0",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "ml/src"]
testpaths = ["ml/tests", "tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires external services (PostgreSQL, Redis)",
    "e2e: full-stack end-to-end test",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "ml/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src", "ml/src"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]
